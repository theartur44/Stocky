# Servidor de sincronización de Stocky.
#
#   móviles ──HTTPS (dominio) o HTTP (IP de casa)──▶ caddy ──(red «frontend»)──▶ api ──TLS (red «backend», sin Internet)──▶ db
#
# Instalar / actualizar: ./stocky.sh   (configuración en .env, ver .env.example)
#
# - Solo Caddy publica puertos. La API y PostgreSQL no son accesibles desde fuera.
# - PostgreSQL exige TLS 1.3 + SCRAM; la API verifica su certificado (verify-full).
# - Los secretos se leen de ./secrets (generados con scripts/generate-secrets.sh, nunca en git).
# - Los datos del inventario se guardan cifrados con AES-256-GCM por la propia API.
# Instrucciones completas: docs/servidor-docker.md
name: stocky

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${STOCKY_HTTP_PORT:-80}:80"
      - "${STOCKY_HTTPS_PORT:-443}:443"
      - "${STOCKY_HTTPS_PORT:-443}:443/udp"
    environment:
      STOCKY_ADDRESS: ${STOCKY_ADDRESS:?Define STOCKY_ADDRESS en .env (ejecuta ./stocky.sh)}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      # «domain» = HTTPS automático; «lan» = HTTP para la red de casa.
      - ./caddy/${STOCKY_MODE:-domain}.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [frontend]
    depends_on:
      api:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  api:
    build: ../../services/api
    image: stocky-api:local
    restart: unless-stopped
    environment:
      STOCKY_ENV: production
      # Dirección del servidor y, si hay túnel con HTTPS (Cloudflare…), también su dominio.
      STOCKY_ALLOWED_HOSTS: ${STOCKY_ADDRESS},localhost,${STOCKY_TUNNEL_DOMAIN:-localhost}
      STOCKY_REGISTRATION: ${STOCKY_REGISTRATION:-invite_code}
      STOCKY_JWT_SECRET_FILE: /run/secrets/jwt_secret
      STOCKY_EMAIL_PEPPER_FILE: /run/secrets/email_pepper
      STOCKY_DATA_KEYS_FILE: /run/secrets/data_keys
      STOCKY_REGISTRATION_CODE_FILE: /run/secrets/registration_code
      POSTGRES_HOST: db
      POSTGRES_DB: stocky
      POSTGRES_USER: stocky
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_SSLMODE: verify-full
      POSTGRES_SSLROOTCERT: /run/secrets/db_ca_crt
    secrets: [jwt_secret, email_pepper, data_keys, registration_code, postgres_password, db_ca_crt]
    networks: [frontend, backend]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/stocky-start.sh"]
    environment:
      POSTGRES_DB: stocky
      POSTGRES_USER: stocky
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth=scram-sha-256 --data-checksums"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/start.sh:/usr/local/bin/stocky-start.sh:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    secrets: [postgres_password, db_server_crt, db_server_key]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocky -d stocky -h /var/run/postgresql"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    shm_size: 128mb

secrets:
  jwt_secret: { file: ./secrets/jwt_secret }
  email_pepper: { file: ./secrets/email_pepper }
  data_keys: { file: ./secrets/data_keys }
  registration_code: { file: ./secrets/registration_code }
  postgres_password: { file: ./secrets/postgres_password }
  db_ca_crt: { file: ./secrets/db_ca.crt }
  db_server_crt: { file: ./secrets/db_server.crt }
  db_server_key: { file: ./secrets/db_server.key }

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  frontend:
  # Red interna: sin salida a Internet. Solo API ↔ base de datos.
  backend:
    internal: true
