name: APK Android (pruebas)

# Compila un APK instalable para PROBAR la app en un dispositivo.
# Se firma con la clave propia si está configurada (secrets ANDROID_*, ver
# docs/publicar-version.md), para poder instalarlo encima de una versión
# publicada; si no, con la clave de pruebas de la plantilla.
# Solo se lanza a mano (Actions → APK Android (pruebas) → Run workflow), para
# compilar únicamente la última versión y no un APK por cada cambio.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Comprobaciones previas
        run: |
          npm run typecheck
          npm test -- --ci

      - name: Generar proyecto nativo (expo prebuild)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Clave de firma (si está configurada)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/stocky-release.keystore"
            echo "STOCKY_KEYSTORE=$RUNNER_TEMP/stocky-release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK release
        working-directory: apps/android/android
        env:
          NODE_ENV: production
          STOCKY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STOCKY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STOCKY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Información del APK
        working-directory: apps/android/android/app/build/outputs/apk/release
        run: |
          ls -la
          sha256sum app-release.apk | tee app-release.apk.sha256
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/aapt dump permissions app-release.apk | tee permisos.txt
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/aapt dump badging app-release.apk | grep -E "package:|sdkVersion|targetSdkVersion|native-code" | tee badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: stocky-apk-${{ github.sha }}
          path: |
            apps/android/android/app/build/outputs/apk/release/app-release.apk
            apps/android/android/app/build/outputs/apk/release/app-release.apk.sha256
            apps/android/android/app/build/outputs/apk/release/permisos.txt
            apps/android/android/app/build/outputs/apk/release/badging.txt
          retention-days: 14
