name: Publicar versión

# Al publicar una release en GitHub (Releases → Draft a new release, etiqueta
# vX.Y.Z), compila el APK con ese número de versión y lo adjunta a la release.
# La app avisa de la nueva versión en cuanto el APK está adjunto.
#
# También se puede lanzar a mano (Actions → Publicar versión → Run workflow)
# indicando la versión: entonces crea la release y adjunta el APK.
#
# Seguridad: la compilación (npm, Gradle y cientos de dependencias) se hace en
# un trabajo SIN la clave de firma y sin permiso de escritura. La firma y la
# subida van en otro trabajo que solo ejecuta apksigner y gh. Hacen falta los
# secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
# y ANDROID_KEY_PASSWORD (ver docs/publicar-version.md); sin ellos no se publica.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (p. ej. v0.2.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    # bash -eo pipefail: un error en medio de una tubería detiene el flujo.
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name || inputs.version }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Número de versión desde la etiqueta
        id: version
        run: node scripts/set-app-version.mjs "$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Dependencias y comprobaciones
        working-directory: apps/android
        run: |
          npm ci
          npm run typecheck
          npm test -- --ci

      - name: Generar proyecto nativo
        working-directory: apps/android
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilar APK (sin la clave propia; se firma en el trabajo siguiente)
        working-directory: apps/android/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: apk-sin-firmar
          path: apps/android/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.version }}
      VERSION: ${{ needs.build.outputs.version }}
      # Huella (SHA-256) del certificado con el que se firman todas las versiones. Es pública
      # (va dentro de cada APK). Si cambiara, Android no instalaría la actualización encima y
      # habría que desinstalar la app: por eso se comprueba antes de publicar.
      EXPECTED_CERT_SHA256: a67e184a0da4bce04c442ae394f2fa62e0678b543060d943202a317a35e3f93d
    steps:
      - name: La versión es mayor que la última publicada
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          latest=${latest#v}
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -1)" != "$VERSION" -o "$latest" = "$VERSION" ]; then
            echo "::error::La versión $VERSION no es mayor que la última publicada ($latest): Android no la instalaría encima."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: apk-sin-firmar

      - name: Firmar con la clave propia
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STOCKY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STOCKY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STOCKY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STOCKY_KEY_ALIAS" ]; then
            echo "::error::Faltan los secrets de firma (ANDROID_*). No se publica un APK firmado con la clave de pruebas."
            exit 1
          fi
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Versión no válida"; exit 1; }
          ks="$RUNNER_TEMP/stocky-release.keystore"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          name="stocky-$VERSION.apk"
          "$tools/apksigner" sign --ks "$ks" --ks-key-alias "$STOCKY_KEY_ALIAS" \
            --ks-pass env:STOCKY_KEYSTORE_PASSWORD --key-pass env:STOCKY_KEY_PASSWORD \
            --out "$name" app-release.apk
          cert=$("$tools/apksigner" verify --print-certs "$name" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::El APK no está firmado con el certificado de siempre ($cert). No se publica: no se podría instalar encima."
            exit 1
          fi
          echo "Firmado con el certificado de siempre."
          sha256sum "$name" > "$name.sha256"

      - name: Crear la release (lanzamiento manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Stocky $VERSION" --generate-notes

      - name: Adjuntar el APK a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "stocky-$VERSION.apk" "stocky-$VERSION.apk.sha256" --clobber
